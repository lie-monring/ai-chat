<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Yuki - 聊天</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiWXVraSBDaGF0Iiwic2hvcnRfbmFtZSI6Ill1a2kiLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJ0aGVtZV9jb2xvciI6IiNlODg3OWEiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiI2ZhZjhmNSJ9">
<meta name="theme-color" content="#e8879a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ============================================================
   CSS Variables & Base
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

[data-theme="light"] {
  --bg:#faf8f5; --surface:#fff; --primary:#e8879a; --primary-light:#fce4ec;
  --text:#3d2c2c; --text-secondary:#8c7b7b; --bubble-user:#e8879a;
  --bubble-ai:#f5f0eb; --border:#e8ddd5; --shadow:0 1px 3px rgba(0,0,0,.06);
  --code-bg:#f0e8e0; --pill-bg:#f0e8e0; --pill-active:#e8879a;
  --sidebar-bg:#f5f1ec; --sidebar-active:#fce4ec; --overlay-bg:rgba(0,0,0,.3);
  --search-bg:#f0ebe6; --blockquote-border:#e8879a; --blockquote-bg:#fdf5f7;
}
[data-theme="dark"] {
  --bg:#1a1a2e; --surface:#16213e; --primary:#d4879a; --primary-light:#3d2030;
  --text:#e0d5c1; --text-secondary:#a09080; --bubble-user:#c06b80;
  --bubble-ai:#1e2a3a; --border:#2a3545; --shadow:0 1px 3px rgba(0,0,0,.3);
  --code-bg:#0f1923; --pill-bg:#1e2a3a; --pill-active:#d4879a;
  --sidebar-bg:#111827; --sidebar-active:#1e2a3a; --overlay-bg:rgba(0,0,0,.5);
  --search-bg:#1a2535; --blockquote-border:#d4879a; --blockquote-bg:#1a2030;
}

body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); height:100dvh;
  display:flex; justify-content:center; align-items:center;
  -webkit-tap-highlight-color:transparent; transition:background .3s,color .3s;
  overscroll-behavior:none;
}

/* ============================================================
   App Shell
   ============================================================ */
#app {
  width:100%; max-width:960px; height:100dvh; display:flex; flex-direction:row;
  background:var(--surface); box-shadow:var(--shadow); position:relative; transition:background .3s; overflow:hidden;
}

/* ============================================================
   Sidebar
   ============================================================ */
#sidebar {
  width:240px; flex-shrink:0; display:flex; flex-direction:column;
  background:var(--sidebar-bg); border-right:1px solid var(--border);
  transition:background .3s,transform .25s ease;
}
#sidebar-header {
  padding:12px 14px; border-bottom:1px solid var(--border); display:flex;
  align-items:center; gap:8px; flex-shrink:0;
}
#sidebar-header .title { flex:1; font-size:13px; font-weight:600; color:var(--text-secondary) }
#sidebar-header .count { font-size:11px; color:var(--text-secondary); background:var(--pill-bg); padding:2px 8px; border-radius:10px }
#sidebar-list { flex:1; overflow-y:auto; padding:6px 0; -webkit-overflow-scrolling:touch }
#sidebar-list .group-header {
  padding:8px 14px 2px; font-size:11px; color:var(--text-secondary);
  display:flex; align-items:center; gap:4px; user-select:none;
}
#sidebar-list .group-header .link-icon { font-size:10px }
.char-item {
  display:flex; align-items:center; gap:10px; padding:8px 14px; cursor:pointer;
  transition:background .1s; position:relative; user-select:none;
  border-left:3px solid transparent;
}
.char-item:hover { background:var(--bubble-ai) }
.char-item.active { background:var(--sidebar-active); border-left-color:var(--primary) }
.char-item .c-avatar {
  width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#f8bbd0,#e8879a);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
}
.char-item .c-info { flex:1; min-width:0 }
.char-item .c-name { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.char-item .c-desc { font-size:11px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.char-item .c-badge { font-size:10px; background:var(--primary-light); color:var(--primary); padding:1px 6px; border-radius:8px; flex-shrink:0 }
#sidebar-footer {
  padding:10px 14px; border-top:1px solid var(--border); flex-shrink:0;
}
#btn-add-char {
  width:100%; padding:8px; border:1px dashed var(--border); border-radius:10px;
  background:transparent; color:var(--text-secondary); font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:4px; transition:all .15s;
}
#btn-add-char:hover { border-color:var(--primary); color:var(--primary) }
#btn-add-char:disabled { opacity:.4; cursor:default }

/* ============================================================
   Chat Area
   ============================================================ */
#chat-area {
  flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; position:relative;
}

/* Header */
#header {
  padding:8px 14px; border-bottom:1px solid var(--border); display:flex;
  align-items:center; gap:10px; flex-shrink:0; background:var(--surface);
}
#btn-sidebar-toggle { display:none; width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:16px;cursor:pointer;align-items:center;justify-content:center;color:var(--text-secondary);flex-shrink:0 }
#header .avatar { width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f8bbd0,#e8879a);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0 }
#header .info{flex:1;min-width:0}
#header .name{font-size:15px;font-weight:600}
#header .status{font-size:11px;color:var(--text-secondary)}
#header .same-person-badge { font-size:10px; color:var(--primary); cursor:pointer; user-select:none; margin-left:4px }
#header .actions{display:flex;gap:4px}
#header .actions button{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}
#header .actions button:active{background:var(--bubble-ai)}
#header .actions button.active-filter{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}

/* ============================================================
   Context menu
   ============================================================ */
#ctx-menu {
  display:none; position:fixed; z-index:500; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.12); padding:4px 0; min-width:140px;
}
#ctx-menu.show { display:block }
#ctx-menu button {
  display:block; width:100%; padding:8px 16px; border:none; background:none;
  font-size:13px; cursor:pointer; text-align:left; color:var(--text); font-family:inherit;
}
#ctx-menu button:hover { background:var(--bubble-ai) }
#ctx-menu button.danger { color:#c0392b }

/* Search bar */
#search-bar{display:none;padding:6px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:6px;align-items:center}
#search-bar.open{display:flex}
#search-bar input{flex:1;padding:7px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;outline:none;background:var(--search-bg);color:var(--text);font-family:inherit}
#search-bar input:focus{border-color:var(--primary)}
#search-bar .search-count{font-size:11px;color:var(--text-secondary);white-space:nowrap}
#search-bar button{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}

/* Scene pills */
#scene-bar{padding:6px 14px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#scene-bar::-webkit-scrollbar{display:none}
#scene-bar .pill{flex-shrink:0;padding:5px 11px;border-radius:14px;font-size:12px;border:1px solid var(--border);background:var(--pill-bg);color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none}
#scene-bar .pill:active{transform:scale(.95)}
#scene-bar .pill.active{background:var(--pill-active);color:#fff;border-color:var(--pill-active)}

/* Settings */
#settings-panel{display:none;padding:14px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
#settings-panel.open{display:block}
#settings-panel label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:3px}
#settings-panel input[type=password],#settings-panel input[type=text],#settings-panel select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--surface);color:var(--text)}
#settings-panel input:focus,#settings-panel select:focus{border-color:var(--primary)}
#settings-panel .hint{font-size:11px;color:var(--text-secondary);margin-top:3px}
#settings-panel .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
#settings-panel .row button{flex:1;padding:7px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:12px;cursor:pointer;color:var(--text);min-width:60px}
#settings-panel .row button.danger{color:#c0392b;border-color:#e8c8c8}
#settings-panel .row button:active{background:var(--bubble-ai)}
#settings-panel .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
#settings-panel .toggle-row span{font-size:13px}
#settings-panel .toggle-row input[type=checkbox]{width:18px;height:18px}
#settings-panel .sep{height:1px;background:var(--border);margin:10px 0}
#settings-panel .storage-bar{height:4px;border-radius:2px;background:var(--border);margin-top:4px;overflow:hidden}
#settings-panel .storage-bar .fill{height:100%;border-radius:2px;background:var(--primary);transition:width .3s}
#settings-panel input[type=range]{accent-color:var(--primary);width:120px}

/* Key banner */
#key-banner{display:none;padding:9px 14px;background:#fff3cd;color:#856404;font-size:12px;text-align:center;border-bottom:1px solid #ffc107;flex-shrink:0}
#key-banner.show{display:block}
#key-banner a{color:#856404;font-weight:600;cursor:pointer;text-decoration:underline}

/* Token bar */
#token-bar{padding:2px 14px 0;font-size:10px;color:var(--text-secondary);text-align:right;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
#token-bar .token-info{opacity:.7}
#token-bar .stop-btn{display:none;padding:2px 10px;border:1px solid #e57373;background:transparent;color:#e57373;border-radius:10px;font-size:10px;cursor:pointer;font-family:inherit}
#token-bar .stop-btn.show{display:inline-block}
#token-bar .stop-btn:active{background:#e57373;color:#fff}

/* Input */
#input-area{padding:6px 10px calc(6px + env(safe-area-inset-bottom,10px));border-top:1px solid var(--border);display:flex;gap:6px;align-items:flex-end;flex-shrink:0;background:var(--surface);position:relative}
#input-area textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:20px;padding:9px 14px;font-size:15px;line-height:1.4;max-height:100px;outline:none;font-family:inherit;background:var(--bg);color:var(--text);transition:border-color .15s}
#input-area textarea:focus{border-color:var(--primary)}
#input-area .input-meta{position:absolute;top:-16px;right:52px;font-size:10px;color:var(--text-secondary);opacity:.5;pointer-events:none}
#input-area #btn-send{width:38px;height:38px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none}
#input-area #btn-send:active{transform:scale(.93);opacity:.85}
#input-area #btn-send.disabled{background:#d4b8bf;cursor:default;transform:none;opacity:1;pointer-events:none}

/* Scroll button */
#btn-scroll-bottom{display:none;position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:14px;cursor:pointer;color:var(--text-secondary);z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.1);align-items:center;justify-content:center}
#btn-scroll-bottom.show{display:flex}

/* Toast */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:600;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}

/* Error banner */
#error-banner{display:none;padding:8px 14px;background:#fce4ec;color:#c62828;font-size:12px;text-align:center;border-bottom:1px solid #ef9a9a;flex-shrink:0;align-items:center;gap:8px}
#error-banner.show{display:flex}
#error-banner .err-text{flex:1}
#error-banner button{padding:2px 10px;border:1px solid #c62828;background:transparent;color:#c62828;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit}

/* ============================================================
   Overlays — Diary, Modals, Drawer
   ============================================================ */
#diary-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;background:var(--surface);flex-direction:column}
#diary-overlay.show{display:flex}
#diary-header{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
#diary-header .title{flex:1;font-size:16px;font-weight:600}
#diary-header button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}
#diary-header button:active{background:var(--bubble-ai)}
#diary-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.diary-entry{background:var(--bubble-ai);border-radius:14px;padding:14px;font-size:14px;line-height:1.65}
.diary-entry .date{font-size:11px;color:var(--text-secondary);margin-bottom:8px}
.diary-entry .content{white-space:pre-wrap}
#diary-footer{padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0}
#diary-footer button{width:100%;padding:10px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-size:15px;cursor:pointer}
#diary-footer button:active{opacity:.85}
#diary-footer button:disabled{background:#d4b8bf;cursor:default}
#diary-empty{text-align:center;color:var(--text-secondary);padding:40px 20px}

.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:400;background:var(--overlay-bg);justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-box h3{font-size:16px;margin-bottom:12px}
.modal-box label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:3px;margin-top:8px}
.modal-box input[type=text],.modal-box textarea,.modal-box select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--surface);color:var(--text);font-family:inherit;resize:vertical}
.modal-box textarea{min-height:120px}
.modal-box input:focus,.modal-box textarea:focus{border-color:var(--primary)}
.modal-box .modal-btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal-box .modal-btns button{padding:8px 18px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit}
.modal-box .modal-btns .btn-cancel{border:1px solid var(--border);background:var(--surface);color:var(--text)}
.modal-box .modal-btns .btn-primary{background:var(--primary);color:#fff;border:none}
.modal-box .modal-btns .btn-danger{background:#c0392b;color:#fff;border:none}
.modal-box .preview{padding:10px;background:var(--bubble-ai);border-radius:10px;font-size:12px;color:var(--text-secondary);max-height:100px;overflow-y:auto;margin-top:4px;white-space:pre-wrap;line-height:1.4}
.modal-box .emoji-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.modal-box .emoji-grid span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border-radius:8px;border:1px solid transparent}
.modal-box .emoji-grid span:hover,.modal-box .emoji-grid span.sel{border-color:var(--primary);background:var(--primary-light)}

/* Drawer backdrop */
#drawer-backdrop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;background:var(--overlay-bg)}
#drawer-backdrop.show{display:block}

/* ============================================================
   Messages
   ============================================================ */
#messages{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.msg{max-width:82%;animation:msgFadeIn .25s ease;position:relative}
@keyframes msgFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end}
.msg.ai{align-self:flex-start}
.msg .msg-header{display:flex;align-items:center;gap:6px;margin-bottom:2px;padding:0 4px}
.msg.user .msg-header{justify-content:flex-end}
.msg.ai .msg-header{justify-content:flex-start}
.msg .msg-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:var(--bubble-ai)}
.msg .msg-time{font-size:10px;color:var(--text-secondary);opacity:.7}
.msg .msg-search-hi{background:#fff176;color:#333;border-radius:2px;padding:0 1px}
[data-theme="dark"] .msg .msg-search-hi{background:#f9a825;color:#111}
.msg .bubble{padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word;position:relative}
.msg.user .bubble{background:var(--bubble-user);color:#fff;border-bottom-right-radius:5px}
.msg.ai .bubble{background:var(--bubble-ai);color:var(--text);border-bottom-left-radius:5px}
.msg .bubble a{color:inherit;opacity:.85;text-decoration:underline}
.msg .bubble code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.9em}
.msg .bubble pre{background:var(--code-bg);padding:8px 10px;border-radius:8px;overflow-x:auto;font-size:.85em;margin:4px 0;position:relative}
.msg .bubble pre code{background:none;padding:0}
.msg .bubble .code-copy-btn{position:absolute;top:4px;right:4px;padding:2px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text-secondary);font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s;font-family:inherit}
.msg .bubble pre:hover .code-copy-btn{opacity:1}
.msg .bubble .code-copy-btn:active{background:var(--primary);color:#fff;border-color:var(--primary)}
.msg .bubble blockquote{border-left:3px solid var(--blockquote-border);background:var(--blockquote-bg);padding:6px 10px;margin:4px 0;border-radius:0 8px 8px 0;font-size:.92em}
.msg .bubble ul,.msg .bubble ol{padding-left:1.4em;margin:4px 0}
.msg .bubble li{margin:2px 0}
.msg .bubble hr{border:none;border-top:1px solid var(--border);margin:8px 0}
.msg .bubble table{border-collapse:collapse;margin:4px 0;font-size:.88em;width:100%}
.msg .bubble th,.msg .bubble td{border:1px solid var(--border);padding:4px 8px;text-align:left}
.msg .bubble th{background:var(--code-bg);font-weight:600}

/* Time on messages */
.msg .time{font-size:10px;color:var(--text-secondary);opacity:.55;margin-top:2px;padding:0 4px;user-select:none}
.msg.user .time{text-align:right}
.msg.ai .time{text-align:left}

/* Regen button */
.msg .btn-regen{display:none;position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:11px;cursor:pointer;color:var(--text-secondary);align-items:center;justify-content:center;z-index:2;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.msg.ai:last-child .btn-regen{display:flex}
.msg .btn-regen:active{background:var(--bubble-ai)}

/* Action buttons on messages */
.msg-actions{display:none;gap:4px;margin-top:3px;padding:0 4px}
.msg-actions.show{display:flex}
.msg.user .msg-actions{justify-content:flex-end}
.msg.ai .msg-actions{justify-content:flex-start}
.msg-actions button{font-size:11px;padding:3px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer}
.msg-actions button:active{background:var(--bubble-ai)}

/* Edit mode */
.msg .edit-area{display:none;flex-direction:column;gap:4px}
.msg .edit-area textarea{width:100%;padding:8px 12px;border-radius:14px;border:1px solid var(--primary);font-size:14px;font-family:inherit;resize:none;outline:none;background:var(--surface);color:var(--text)}
.msg .edit-area .btns{display:flex;gap:4px;justify-content:flex-end}
.msg .edit-area .btns button{font-size:12px;padding:4px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text)}
.msg .edit-area .btns button.save{background:var(--primary);color:#fff;border:none}

/* Typing indicator */
#typing{display:none;align-self:flex-start;padding:7px 13px;background:var(--bubble-ai);border-radius:18px;border-bottom-left-radius:5px;margin-left:28px}
#typing.show{display:block}
#typing .typing-inner{display:flex;align-items:center;gap:6px}
#typing .typing-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--bubble-ai);position:absolute;left:-28px;top:0}
#typing .dots{display:flex;gap:3px}
#typing .dots span{width:7px;height:7px;border-radius:50%;background:var(--text-secondary);opacity:.4;animation:typePulse 1.4s ease-in-out infinite}
#typing .dots span:nth-child(2){animation-delay:.2s}
#typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes typePulse{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

/* Scene transition overlay */

#scene-transition.show{display:flex;animation:sceneFlash .5s ease}
@keyframes sceneFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#scene-transition .scene-label{background:var(--surface);padding:10px 20px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.15)}

/* Empty state */
#empty-hint{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:40px 20px;color:var(--text-secondary);text-align:center;flex:1}
#empty-hint .icon{font-size:44px}
#empty-hint .title{font-size:16px;font-weight:600;color:var(--text)}
#empty-hint .sub{font-size:13px}

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
function generateId() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let id = 'c_';
  for (let i = 0; i < 8; i++) id += chars[Math.floor(Math.random() * chars.length)];

}
function safeJsonParse(str, fallback) { try { return JSON.parse(str); } catch { return fallback; } }
function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

function formatTime(d) {
  if (!d) return '';
  const dt = (typeof d === 'string' || typeof d === 'number') ? new Date(d) : d;
  if (isNaN(dt)) return '';
  const hh = String(dt.getHours()).padStart(2,'0');
  const mm = String(dt.getMinutes()).padStart(2,'0');
  return hh + ':' + mm;
}

function estimateTokens(text) {
  if (!text) return 0;
  let count = 0;
  for (const ch of text) {
    count += ch.charCodeAt(0) > 0x7f ? 1.5 : 0.25;
  }
  return Math.ceil(count);
}

function debounce(fn, ms) {
  let t;
  return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
}

function renderMarkdown(text, highlight) {
  let html = escapeHtml(text);

  // Code blocks (must be first to avoid inner processing)
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const label = lang ? ' data-lang="' + lang + '"' : '';
    return '<pre' + label + '><button class="code-copy-btn" onclick="copyCodeBlock(this)">复制</button><code>' + code + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Tables (before other inline processing)
  html = html.replace(/(?:^|\n)((?:\|[^\n]+\|\n?)+)/g, (match, tableBlock) => {
    const rows = tableBlock.trim().split('\n').filter(r => r.trim());
    if (rows.length < 2) return match;
    let result = '<table>';
    rows.forEach((row, i) => {
      const cells = row.split('|').filter(c => c.trim() !== '');
      if (cells.length === 0) return;
      if (i > 0 && cells.every(c => /^[\s\-:]+$/.test(c))) return;
      const tag = i === 0 ? 'th' : 'td';
      result += '<tr>' + cells.map(c => '<' + tag + '>' + c.trim() + '</' + tag + '>').join('') + '</tr>';
    });
    result += '</table>';
    return result;
  });

  // Blockquotes
  html = html.replace(/(?:^|\n)((?:&gt;[^\n]*\n?)+)/g, (match, quote) => {
    const content = quote.replace(/(?:^|\n)&gt;\s?/g, '\n').trim();
    return '\n<blockquote>' + content + '</blockquote>\n';
  });

  // Unordered lists
  html = html.replace(/(?:^|\n)((?:[\-\*]\s[^\n]+\n?)+)/g, (match, list) => {
    const items = list.trim().split('\n').filter(l => l.trim()).map(l => {
      return '<li>' + l.replace(/^[\-\*]\s/, '') + '</li>';
    }).join('');
    return '<ul>' + items + '</ul>';
  });

  // Ordered lists
  html = html.replace(/(?:^|\n)((?:\d+\.\s[^\n]+\n?)+)/g, (match, list) => {
    const items = list.trim().split('\n').filter(l => l.trim()).map(l => {
      return '<li>' + l.replace(/^\d+\.\s/, '') + '</li>';
    }).join('');
    return '<ol>' + items + '</ol>';
  });

  // Horizontal rules
  html = html.replace(/(?:^|\n)([\-\*_]{3,})(?:\n|$)/g, '\n<hr>\n');

  // Bold, italic, strikethrough
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

  // Links
  html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

  // Search highlight
  if (highlight) {
    const escaped = highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + escaped + ')', 'gi');
    html = html.replace(re, '<mark class="msg-search-hi">$1</mark>');
  }

  return html;
}

// Global copy function for code blocks
window.copyCodeBlock = function(btn) {
  const code = btn.parentElement.querySelector('code');
  if (!code) return;
  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = code.textContent;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  });
};

function storageGet(key, fallback) {
  try { const r = localStorage.getItem(key); return r ? safeJsonParse(r, fallback) : fallback; }
  catch { return fallback; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) {
    if (e.name === 'QuotaExceededError') {
      showError('存储空间已满！请清理旧对话或导出备份后清空数据。', true);
    }
    return false;
  }
}
function storageRemove(key) { try { localStorage.removeItem(key); } catch {} }

function updateStorageInfo() {
  let total = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('yuki_')) total += (localStorage.getItem(k) || '').length;
    }
  } catch {}
  const usedKB = (total / 1024).toFixed(0);
  const pct = Math.min(100, (total / (5 * 1024 * 1024)) * 100).toFixed(0);
  $storageInfo.textContent = '已使用: ~' + usedKB + ' KB / 5 MB (' + pct + '%)';
  $storageFill.style.width = pct + '%';
}

}

let pendingImport = null;
function handleFileImport(e) {
  const file = e.target.files[0]; if (!file) return; e.target.value = '';
  const ext = file.name.toLowerCase().split('.').pop();
  if (ext === 'json') {
    const reader = new FileReader();
    reader.onload = () => { try { showImportConfirm(mapCardToCharacter(JSON.parse(reader.result))); } catch (err) { showToast('JSON 解析失败: ' + err.message); } };
    reader.readAsText(file);
  } else if (ext === 'png') {
    const reader = new FileReader();
    reader.onload = () => { try { showImportConfirm(mapCardToCharacter(extractCardFromPNG(reader.result))); } catch (err) { showToast('PNG 解析失败: ' + err.message); } };
    reader.readAsArrayBuffer(file);
  } else showToast('不支持的文件格式，请选择 .json 或 .png 文件');
}
function extractCardFromPNG(buffer) {
  const arr = new Uint8Array(buffer); let offset = 8;
  while (offset < arr.length - 8) {
    const len = (arr[offset]<<24)|(arr[offset+1]<<16)|(arr[offset+2]<<8)|arr[offset+3];
    const type = String.fromCharCode(arr[offset+4],arr[offset+5],arr[offset+6],arr[offset+7]);
    const data = arr.subarray(offset+8, offset+8+len);
    if (type === 'tEXt') {
      const nullIdx = data.indexOf(0);
      if (nullIdx !== -1) {
        const kw = new TextDecoder().decode(data.slice(0,nullIdx));
        if (kw === 'chara' || kw === 'ccv3') return JSON.parse(atob(new TextDecoder().decode(data.slice(nullIdx+1))));
      }
    }
    offset += 12 + len;
  }
  throw new Error('PNG 中没有找到 Character Card 数据');
}
function mapCardToCharacter(card) {
  let data, version;
  if (card.spec === 'chara_card_v3') { data = card.data||card; version='v3'; }
  else if (card.spec === 'chara_card_v2') { data = card.data||card; version='v2'; }
  else { data = card; version = (data.system_prompt||data.description||data.personality) ? 'v2' : null; }
  let pp = [];
  if (data.system_prompt) pp.push(data.system_prompt);
  else { if(data.name)pp.push('【角色名】'+data.name); if(data.description)pp.push('【描述】'+data.description); if(data.personality)pp.push('【性格】'+data.personality); if(data.scenario)pp.push('【背景】'+data.scenario); }
  if (data.post_history_instructions) pp.push(data.post_history_instructions);
  return { id:generateId(), name:data.name||'未命名角色', emoji:EMOJI_PALETTE[characters.length%EMOJI_PALETTE.length]||'💬', avatar:data.avatar||null, prompt:pp.join('\n\n')||JSON.stringify(card), description:(typeof data.description==='string'?data.description:(data.name||'')), tags:data.tags||[], cardVersion:version, cardData:card, firstMessage:data.first_mes||'', mesExample:data.mes_example||'', postHistoryInstructions:data.post_history_instructions||'', scenes:deepClone(DEFAULT_SCENES), activeScene:'', samePersonGroup:null, stateDescription:null, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), messageCount:0 };
}

function handleBackupImport(e) {

  const reader = new FileReader();

      const b = JSON.parse(reader.result);

      if (!confirm('确定要导入此备份吗？\n\n当前所有数据将被覆盖！\n导出时间：'+(b.exportedAt||'未知')+'\n角色数量：'+b.characters.length+'\n注意：API Key 不会被导入，需重新设置。')) return;
      characters=b.characters; saveCharacters(characters);
      for(const[id,msgs] of Object.entries(b.messages)) saveMessages(id,msgs);
      for(const[id,entries] of Object.entries(b.diaries)) saveDiary(id,entries);
      config.activeCharId=b.config?.activeCharId||characters[0]?.id||'';

function renderMessage(m, i) {

  const bubble = '<div class="bubble"><div class="bubble-inner">' + renderMarkdown(m.content, currentSearchTerm) + '</div></div>';

  div.innerHTML = (isUser ? '' : header) + bubble + (isUser ? header.replace('msg-header', 'msg-header user-header') : '');
  div.addEventListener('click', e => {
    if (e.target.closest('.msg-actions button')) return;

function toggleActions(msgEl, idx) {
  const wasActive = activeMsgIdx === idx;
  closeActionMenus();
  if (wasActive) return;
  activeMsgIdx = idx;
  let existing = msgEl.querySelector('.msg-actions');
  if (existing) { existing.classList.add('show'); return; }
  const actions = document.createElement('div');
  actions.className = 'msg-actions show';
  if (activeMessages[idx]?.role === 'user') {
    const b = document.createElement('button'); b.textContent = '编辑';
    b.onclick = e => { e.stopPropagation(); editMessage(idx); };
    const c = document.createElement('button'); c.textContent = '复制';
    c.onclick = e => { e.stopPropagation(); copyMessage(idx); };
    actions.appendChild(b); actions.appendChild(c);
  } else {
    const b = document.createElement('button'); b.textContent = '重试';
    b.onclick = e => { e.stopPropagation(); retryMessage(idx); };
    const r = document.createElement('button'); r.textContent = '重新生成';
    r.onclick = e => { e.stopPropagation(); regenerateMessage(idx); };
    const c = document.createElement('button'); c.textContent = '复制';
    c.onclick = e => { e.stopPropagation(); copyMessage(idx); };
    actions.appendChild(b); actions.appendChild(r); actions.appendChild(c);
  }
  msgEl.appendChild(actions);
}
function closeActionMenus() {
  activeMsgIdx = -1;
  document.querySelectorAll('.msg-actions.show').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('.msg.editing').forEach(el => exitEdit(el));

function copyMessage(idx) {
  const text = activeMessages[idx]?.content;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('已复制')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制');
  });
}

// EDIT / RETRY / REGENERATE
// ============================================================
function editMessage(idx) {
  const m = activeMessages[idx]; if (!m || m.role !== 'user') return;
  const msgEl = $messages.querySelector('.msg[data-idx="'+idx+'"]'); if (!msgEl) return;
  msgEl.classList.add('editing');
  msgEl.querySelector('.bubble').style.display = 'none';
  const ea = document.createElement('div'); ea.className = 'edit-area';
  ea.innerHTML = '<textarea rows="3">'+escapeHtml(m.content)+'</textarea><div class="btns"><button class="cancel">取消</button><button class="save">保存并重发</button></div>';
  msgEl.appendChild(ea); ea.style.display = 'flex';
  const ta = ea.querySelector('textarea'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ea.querySelector('.cancel').onclick = e => { e.stopPropagation(); exitEdit(msgEl); };
  ea.querySelector('.save').onclick = e => {
    e.stopPropagation();
    const c = ta.value.trim(); if (!c) return;
    m.content = c; m.ts = Date.now();
    activeMessages.splice(idx + 1);
    saveCurrentMessages(); renderMessages(); closeActionMenus(); generateResponse();
  };
}
function exitEdit(msgEl) {
  msgEl.classList.remove('editing');
  const ea = msgEl.querySelector('.edit-area'); if (ea) ea.remove();
  const b = msgEl.querySelector('.bubble'); if (b) b.style.display = '';

function retryMessage(idx) {
  if (activeMessages[idx]?.role !== 'assistant') return;
  activeMessages.splice(idx, 1);
  saveCurrentMessages(); renderMessages(); closeActionMenus(); generateResponse();
}
function regenerateMessage(idx) {
  if (activeMessages[idx]?.role !== 'assistant') return;
  activeMessages.splice(idx, 1);
  saveCurrentMessages(); renderMessages(); closeActionMenus(); generateResponse();
}

function setLoading(v) {
  isLoading = v;
  $typing.classList.toggle('show', v);
  $btnStop.classList.toggle('show', v);
  updateUI();
  if (v) scrollToBottom();

function stopGeneration() {
  if (abortController) { abortController.abort(); abortController = null; }
  const lastMsg = activeMessages[activeMessages.length - 1];
  if (lastMsg && lastMsg.role === 'assistant' && !lastMsg.content) {
    lastMsg.content = '（已停止生成）';
  }
  setLoading(false);
  saveCurrentMessages();
  renderMessages();
  showToast('已停止生成');
}

async function sendMessage(e) {
  if ($btnSend.classList.contains('disabled')) return;
  const text = $input.value.trim(); if (!text) return;
  if (e && e.target && e.target.blur) try { e.target.blur(); } catch {}
  $input.value = ''; $input.style.height = 'auto'; $inputMeta.textContent = '';
  const ac = activeCharacter();
  activeMessages.push({ role:'user', content:text, characterId:ac?ac.id:'', ts:Date.now() });
  saveCurrentMessages(); renderMessages(); $input.focus(); updateUI();
  await generateResponse();
}

async function generateResponse(systemSuffix) {
  const apiKey = config.apiKey;
  if (!apiKey) return;
  if (isLoading) {
    if (abortController) { abortController.abort(); abortController = null; }
    setLoading(false);
  }
  setLoading(true);
  hideError();

  let sys = activeSystemPrompt();
  if (systemSuffix) sys += '\n\n' + systemSuffix;

  const apiMessages = [{ role:'system', content:sys }];
  const history = activeMessages.slice(-MAX_HISTORY);
  for (const m of history) apiMessages.push({ role:m.role, content:m.content });

  const ac = activeCharacter();
  activeMessages.push({ role:'assistant', content:'', characterId:ac?ac.id:'', ts:Date.now() });
  const aiIdx = activeMessages.length - 1;

  abortController = new AbortController();
  const timeoutId = setTimeout(() => abortController.abort(), 30000);
  const safetyTimer = setTimeout(() => {
    if (isLoading) {
      if (abortController) { abortController.abort(); abortController = null; }
      setLoading(false);
      showError('请求超时，已自动停止', true);
    }
  }, 35000);

  try {
    const resp = await fetch(DEEPSEEK_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({ model:MODEL, messages:apiMessages, stream:true, temperature:+(config.temperature||0.8), max_tokens:+(config.maxTokens||600) }),
      signal: abortController.signal
    });
    clearTimeout(timeoutId);
    clearTimeout(safetyTimer);
    if (!resp.ok) {
      const t = await resp.text();
      let errMsg;
      try { errMsg = JSON.parse(t).error?.message || t; } catch { errMsg = t; }
      if (resp.status === 401) errMsg = 'API Key 无效，请在设置中检查';
      else if (resp.status === 429) errMsg = '请求太频繁，请稍后再试';
      else if (resp.status >= 500) errMsg = '服务器暂时不可用，请稍后再试';
      throw new Error(errMsg);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const l of lines) {
        const s = l.trim();
        if (!s) continue;
        if (!s.startsWith('data:')) continue;
        const d = s.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          const parsed = JSON.parse(d);
          const content = parsed.choices?.[0]?.delta?.content;
          if (content) {
            activeMessages[aiIdx].content += content;
            updateLastBubble(aiIdx);
          }
        } catch {}
      }
    }
    if (buf.trim()) {
      const s = buf.trim();
      if (s.startsWith('data:') && s.slice(5).trim() !== '[DONE]') {
        try {
          const content = JSON.parse(s.slice(5).trim()).choices?.[0]?.delta?.content;
          if (content) activeMessages[aiIdx].content += content;
        } catch {}
      }
    }
    if (!activeMessages[aiIdx].content) activeMessages[aiIdx].content = '（没有说话…可能是信号不好啦）';
  } catch (err) {
    clearTimeout(timeoutId);
    clearTimeout(safetyTimer);
    if (err.name === 'AbortError') {
      if (!activeMessages[aiIdx].content) {
        activeMessages[aiIdx].content = '（请求超时，请稍后再试）';
        showError('请求超时（30秒），请检查网络或稍后重试', true);
      }
    } else {
      activeMessages[aiIdx].content = '唔…好像出了点问题…等等再试试好不好？\n\n（' + err.message + '）';
      showError('请求失败: ' + err.message, true);
    }
  }

  abortController = null;
  saveCurrentMessages(); renderMessages(); setLoading(false); updateUI(); updateTokenEstimate();
  $input.focus();
}

let _streamBubble = null;
let _rafId = 0;
function updateLastBubble(idx) {
  if (!_streamBubble) {
    _streamBubble = document.querySelector('.msg.ai:last-child .bubble-inner');
  }
  cancelAnimationFrame(_rafId);
  _rafId = requestAnimationFrame(() => {
    if (_streamBubble) {
      _streamBubble.innerHTML = renderMarkdown(activeMessages[idx].content);
      scrollToBottom();
    }
  });
}

  $searchPrev.addEventListener('click', () => navigateSearch(-1));
  $searchNext.addEventListener('click', () => navigateSearch(1));
  $searchClose.addEventListener('click', toggleSearch);
  $searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); navigateSearch(e.shiftKey ? -1 : 1); }
    if (e.key === 'Escape') toggleSearch();
  });

  // Input with debounce for UI updates
  const debouncedInputUI = debounce(() => {
    updateInputMeta();
    updateTokenEstimate();
    updateUI();
  }, 150);

  $input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (enterSend && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      else if (!enterSend && e.ctrlKey) { e.preventDefault(); sendMessage(); }
    }
  });
  $input.addEventListener('input', () => {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 100) + 'px';
    debouncedInputUI();
  });

  document.addEventListener('click', e => { if (!e.target.closest('.msg')) closeActionMenus(); });

  $btnCharEditCancel.addEventListener('click', () => $modalCharEdit.classList.remove('show'));
  $btnCharEditSave.addEventListener('click', saveCharEdit);
  $modalCharEdit.addEventListener('click', e => { if (e.target === $modalCharEdit) $modalCharEdit.classList.remove('show'); });
  $charEditEmoji.addEventListener('input', renderEmojiGrid);
  const $btnImportFromModal = document.getElementById('btn-import-from-modal');
  if ($btnImportFromModal) $btnImportFromModal.addEventListener('click', () => $fileImport.click());

  $btnImportCancel.addEventListener('click', () => { $modalImportConfirm.classList.remove('show'); pendingImport = null; });
  $btnImportConfirm.addEventListener('click', confirmImport);
  $modalImportConfirm.addEventListener('click', e => { if (e.target === $modalImportConfirm) { $modalImportConfirm.classList.remove('show'); pendingImport = null; } });
  $btnDeleteCancel.addEventListener('click', () => { $modalDeleteConfirm.classList.remove('show'); pendingDeleteId = null; });
  $btnDeleteConfirm.addEventListener('click', confirmDelete);
  $modalDeleteConfirm.addEventListener('click', e => { if (e.target === $modalDeleteConfirm) { $modalDeleteConfirm.classList.remove('show'); pendingDeleteId = null; } });

  $fileImport.addEventListener('change', handleFileImport);
  $fileImportBackup.addEventListener('change', handleBackupImport);

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key >= '0' && e.key <= '9') {
      e.preventDefault();
      const idx = e.key === '0' ? 9 : parseInt(e.key) - 1;
      if (idx < characters.length) switchCharacter(characters[idx].id);
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
      e.preventDefault();
      if (!$searchBar.classList.contains('open')) toggleSearch();
      $searchInput.focus();
    }
  });

  // ---- Mobile swipe gestures for sidebar ----
  let touchStartX = 0, touchStartY = 0, isSwiping = false;
  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    isSwiping = false;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) isSwiping = true;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!isSwiping) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx > 80 && touchStartX < 30 && !$sidebar.classList.contains('open')) {
      openSidebar();
    }
    if (dx < -80 && $sidebar.classList.contains('open')) {
      closeSidebar();
    }
  }, { passive: true });

  // ---- Mobile keyboard viewport adjustment ----
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      const vh = window.visualViewport.height;
      document.documentElement.style.setProperty('--vvh', vh + 'px');
      if (document.activeElement === $input) scrollToBottom();
    });
  }
}

init();
</script>
</body>
</html>
